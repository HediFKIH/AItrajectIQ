<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>LLMInsight - Trace Graph</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; }
        #header {
            background: linear-gradient(135deg, #16213e, #0f3460);
            padding: 20px 30px; border-bottom: 2px solid #e94560;
        }
        #header h1 { font-size: 22px; color: #e94560; margin-bottom: 5px; }
        #header p { font-size: 13px; color: #aaa; }
        #graph { width: 100%; height: calc(100vh - 180px); }
        #legend {
            display: flex; gap: 20px; padding: 12px 30px;
            background: #16213e; border-bottom: 1px solid #333;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
        .legend-dot { width: 14px; height: 14px; border-radius: 3px; }
        #stats {
            position: absolute; bottom: 15px; right: 20px; background: rgba(22,33,62,0.95);
            border: 1px solid #444; border-radius: 8px; padding: 15px; font-size: 12px;
            min-width: 200px;
        }
        #stats h3 { color: #e94560; margin-bottom: 8px; font-size: 14px; }
        .row { display: flex; justify-content: space-between; margin: 3px 0; }
        .val { color: #4fc3f7; font-weight: bold; }
    </style>
</head>
<body>
    <div id="header">
        <h1>LLMInsight - Trace Hierarchy Graph</h1>
        <p>Trace: 6a478ba63b8e491a35efd3ff | Spans: 9</p>
    </div>
    <div id="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#4CAF50"></div> Manager</div>
        <div class="legend-item"><div class="legend-dot" style="background:#2196F3"></div> Worker</div>
        <div class="legend-item"><div class="legend-dot" style="background:#FF9800;border-radius:50%"></div> LLM Call</div>
        <div class="legend-item"><div class="legend-dot" style="background:#9C27B0;transform:rotate(45deg)"></div> Tool</div>
        <div class="legend-item"><div class="legend-dot" style="background:#F44336"></div> Error</div>
    </div>
    <div id="graph"></div>
    <div id="stats">
        <h3>Stats</h3>
        <div class="row"><span>Agents</span><span class="val">4</span></div>
        <div class="row"><span>LLM calls</span><span class="val">4</span></div>
        <div class="row"><span>Tools</span><span class="val">1</span></div>
        <div class="row"><span>Total tokens</span><span class="val">4899</span></div>
        <div class="row"><span>Total latency</span><span class="val">1196ms</span></div>
    </div>
    <script>
        var nodes = new vis.DataSet([{"id": "span-4668feeed42d", "label": "gpt-4o-mini\n1374->179 tok\n305ms", "color": "#FF9800", "shape": "ellipse", "title": "Type: llm\nName: gpt-4o-mini\nSpan ID: span-4668feeed42d\nLatency: 305ms\nModel: gpt-4o-mini\nTokens in: 1374\nTokens out: 179", "font": {"size": 12, "color": "#fff"}, "borderWidth": 2, "shadow": true}, {"id": "span-e7c586d8effd", "label": "web_search\n76ms", "color": "#9C27B0", "shape": "diamond", "title": "Type: tool\nName: web_search\nSpan ID: span-e7c586d8effd\nLatency: 76ms\nInput: {'query': 'Quel est le coût total de possession d'une Tesla ", "font": {"size": 12, "color": "#fff"}, "borderWidth": 2, "shadow": true}, {"id": "span-dcf2386ffd3a", "label": "gpt-4o-mini\n1446->385 tok\n313ms", "color": "#FF9800", "shape": "ellipse", "title": "Type: llm\nName: gpt-4o-mini\nSpan ID: span-dcf2386ffd3a\nLatency: 313ms\nModel: gpt-4o-mini\nTokens in: 1446\nTokens out: 385", "font": {"size": 12, "color": "#fff"}, "borderWidth": 2, "shadow": true}, {"id": "span-fff90cd36a63", "label": "worker-recherche\n(worker)\n396ms", "color": "#2196F3", "shape": "box", "title": "Type: agent\nName: worker-recherche\nSpan ID: span-fff90cd36a63\nLatency: 396ms\nRole: worker", "font": {"size": 12, "color": "#fff"}, "borderWidth": 2, "shadow": true}, {"id": "span-00af024e2049", "label": "gpt-4o-mini\n296->196 tok\n125ms", "color": "#FF9800", "shape": "ellipse", "title": "Type: llm\nName: gpt-4o-mini\nSpan ID: span-00af024e2049\nLatency: 125ms\nModel: gpt-4o-mini\nTokens in: 296\nTokens out: 196", "font": {"size": 12, "color": "#fff"}, "borderWidth": 2, "shadow": true}, {"id": "span-75ddad16be16", "label": "worker-calcul\n(worker)\n130ms", "color": "#2196F3", "shape": "box", "title": "Type: agent\nName: worker-calcul\nSpan ID: span-75ddad16be16\nLatency: 130ms\nRole: worker", "font": {"size": 12, "color": "#fff"}, "borderWidth": 2, "shadow": true}, {"id": "span-b8a44edf785c", "label": "gpt-4o-mini\n935->88 tok\n348ms", "color": "#FF9800", "shape": "ellipse", "title": "Type: llm\nName: gpt-4o-mini\nSpan ID: span-b8a44edf785c\nLatency: 348ms\nModel: gpt-4o-mini\nTokens in: 935\nTokens out: 88", "font": {"size": 12, "color": "#fff"}, "borderWidth": 2, "shadow": true}, {"id": "span-a38a008c4229", "label": "worker-redaction\n(worker)\n356ms", "color": "#2196F3", "shape": "box", "title": "Type: agent\nName: worker-redaction\nSpan ID: span-a38a008c4229\nLatency: 356ms\nRole: worker", "font": {"size": 12, "color": "#fff"}, "borderWidth": 2, "shadow": true}, {"id": "span-bc8cc7eb038a", "label": "manager\n(manager)\n1196ms", "color": "#4CAF50", "shape": "box", "title": "Type: agent\nName: manager\nSpan ID: span-bc8cc7eb038a\nLatency: 1196ms\nRole: manager", "font": {"size": 12, "color": "#fff"}, "borderWidth": 2, "shadow": true}]);
        var edges = new vis.DataSet([{"from": "span-bc8cc7eb038a", "to": "span-4668feeed42d", "arrows": "to", "color": {"color": "#999"}, "width": 2}, {"from": "span-fff90cd36a63", "to": "span-e7c586d8effd", "arrows": "to", "color": {"color": "#999"}, "width": 2}, {"from": "span-fff90cd36a63", "to": "span-dcf2386ffd3a", "arrows": "to", "color": {"color": "#999"}, "width": 2}, {"from": "span-bc8cc7eb038a", "to": "span-fff90cd36a63", "arrows": "to", "color": {"color": "#999"}, "width": 2}, {"from": "span-75ddad16be16", "to": "span-00af024e2049", "arrows": "to", "color": {"color": "#999"}, "width": 2}, {"from": "span-bc8cc7eb038a", "to": "span-75ddad16be16", "arrows": "to", "color": {"color": "#999"}, "width": 2}, {"from": "span-a38a008c4229", "to": "span-b8a44edf785c", "arrows": "to", "color": {"color": "#999"}, "width": 2}, {"from": "span-bc8cc7eb038a", "to": "span-a38a008c4229", "arrows": "to", "color": {"color": "#999"}, "width": 2}]);
        var container = document.getElementById('graph');
        var data = { nodes: nodes, edges: edges };
        var options = {
            layout: {
                hierarchical: {
                    direction: 'UD',
                    sortMethod: 'directed',
                    levelSeparation: 120,
                    nodeSpacing: 180,
                }
            },
            physics: false,
            interaction: {
                hover: true,
                tooltipDelay: 100,
                navigationButtons: true,
                keyboard: true,
            },
            nodes: { margin: 10 },
        };
        var network = new vis.Network(container, data, options);
    </script>
</body>
</html>
