<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 740" role="img" aria-labelledby="title desc">
  <title id="title">AItrajectIQ architecture</title>
  <desc id="desc">Your application and SDK send spans fire-and-forget to the FastAPI backend and MongoDB. The evaluation engine scores runs. The dashboard shows traces, costs and recommendations.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1320" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12081f"/>
      <stop offset="1" stop-color="#07040e"/>
    </linearGradient>
    <linearGradient id="mark" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="card-app" x1="32" y1="108" x2="412" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12262c"/>
      <stop offset="1" stop-color="#0c161c"/>
    </linearGradient>
    <linearGradient id="card-back" x1="508" y1="108" x2="888" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c1233"/>
      <stop offset="1" stop-color="#120c22"/>
    </linearGradient>
    <linearGradient id="card-ins" x1="984" y1="108" x2="1288" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a1c10"/>
      <stop offset="1" stop-color="#16100c"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-violet" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#67e8f9"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c4b5fd"/>
    </marker>
    <style type="text/css">
      <![CDATA[
      .flow { stroke-dasharray: 8 12; animation: dash 1.4s linear infinite; }
      .flow-slow { stroke-dasharray: 8 14; animation: dash 2s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .pulse-2 { animation: pulse 2.4s ease-in-out 0.8s infinite; }
      .pulse-3 { animation: pulse 2.4s ease-in-out 1.6s infinite; }
      @keyframes dash { to { stroke-dashoffset: -20; } }
      @keyframes pulse {
        0%, 100% { opacity: 0.28; }
        50% { opacity: 0.85; }
      }
      ]]>
    </style>
  </defs>

  <rect width="1320" height="740" rx="28" fill="url(#page)"/>

  <g transform="translate(32 24)">
    <rect width="36" height="36" rx="9" fill="url(#mark)"/>
    <path d="M9 25C13 25 14 18.5 17.5 18.5S22 11.5 25 11.5" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="9" cy="25" r="2.4" fill="#fff"/>
    <circle cx="17.5" cy="18.5" r="2.2" fill="#fff"/>
    <circle cx="25" cy="11.5" r="3.8" fill="none" stroke="#fff" stroke-width="1.8"/>
    <circle cx="25" cy="11.5" r="1.5" fill="#fff"/>
    <text x="48" y="16" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="20" font-weight="700">AItraject<tspan fill="#c4b5fd">IQ</tspan></text>
    <text x="48" y="34" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.6">AGENTIC WORKFLOW OBSERVABILITY</text>
  </g>
  <text x="1288" y="46" text-anchor="end" fill="#94a3b8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">Trace every path. Understand every action.</text>

  <!-- Cards first so arrows and labels sit in the gutters only -->
  <g class="pulse">
    <rect x="32" y="88" width="380" height="456" rx="20" fill="none" stroke="#22d3ee" stroke-width="2"/>
  </g>
  <rect x="32" y="88" width="380" height="456" rx="20" fill="url(#card-app)" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.4"/>
  <rect x="32" y="88" width="7" height="456" rx="4" fill="url(#cyan)"/>
  <text x="54" y="118" fill="#67e8f9" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">YOUR APPLICATION</text>
  <rect x="52" y="136" width="340" height="86" rx="12" fill="#071016" stroke="#164e63"/>
  <text x="68" y="162" fill="#5eead4" font-family="Consolas, ui-monospace, monospace" font-size="13">import aitrajectiq</text>
  <text x="68" y="184" fill="#99f6e4" font-family="Consolas, ui-monospace, monospace" font-size="13">aitrajectiq.init(api_key=...)</text>
  <text x="68" y="206" fill="#ccfbf1" font-family="Consolas, ui-monospace, monospace" font-size="13">aitrajectiq.patch()</text>
  <rect x="52" y="238" width="340" height="198" rx="14" fill="#0a1c22" stroke="#155e75"/>
  <text x="68" y="268" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="700">SDK - aitrajectiq</text>
  <circle cx="76" cy="300" r="4" fill="#22d3ee"/>
  <text x="90" y="305" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">Patches LLM providers</text>
  <circle cx="76" cy="328" r="4" fill="#22d3ee"/>
  <text x="90" y="333" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">Captures spans live</text>
  <circle cx="76" cy="356" r="4" fill="#22d3ee"/>
  <text x="90" y="361" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">Auto-creates traces</text>
  <circle cx="76" cy="384" r="4" fill="#22d3ee"/>
  <text x="90" y="389" fill="#e2e8f0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">Zero extra latency</text>
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="600">
    <rect x="52" y="456" width="68" height="26" rx="13" fill="#083344" stroke="#22d3ee"/>
    <text x="86" y="473" text-anchor="middle" fill="#a5f3fc">Cursor</text>
    <rect x="128" y="456" width="92" height="26" rx="13" fill="#083344" stroke="#22d3ee"/>
    <text x="174" y="473" text-anchor="middle" fill="#a5f3fc">Claude Code</text>
    <rect x="228" y="456" width="108" height="26" rx="13" fill="#083344" stroke="#22d3ee"/>
    <text x="282" y="473" text-anchor="middle" fill="#a5f3fc">OpenTelemetry</text>
  </g>

  <g class="pulse-2">
    <rect x="508" y="88" width="380" height="456" rx="20" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <rect x="508" y="88" width="380" height="456" rx="20" fill="url(#card-back)" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1.4"/>
  <rect x="508" y="88" width="7" height="456" rx="4" fill="url(#violet)"/>
  <text x="530" y="118" fill="#c4b5fd" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">BACKEND</text>
  <text x="530" y="156" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="700">FastAPI</text>
  <text x="530" y="178" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">Ingest, store, evaluate - async</text>
  <g font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#e9d5ff">
    <rect x="528" y="200" width="340" height="34" rx="8" fill="#1e1038" stroke="#6d28d9"/>
    <text x="544" y="222">POST /ingest/span</text>
    <rect x="528" y="242" width="340" height="34" rx="8" fill="#1e1038" stroke="#6d28d9"/>
    <text x="544" y="264">POST /ingest/log</text>
    <rect x="528" y="284" width="340" height="34" rx="8" fill="#1e1038" stroke="#6d28d9"/>
    <text x="544" y="306">POST /otel/v1/traces</text>
    <rect x="528" y="326" width="340" height="34" rx="8" fill="#1e1038" stroke="#6d28d9"/>
    <text x="544" y="348">MCP /mcp</text>
  </g>
  <rect x="528" y="380" width="340" height="132" rx="14" fill="#160c28" stroke="#7c3aed"/>
  <ellipse cx="572" cy="422" rx="26" ry="11" fill="#4c1d95" stroke="#c4b5fd"/>
  <rect x="546" y="422" width="52" height="34" fill="#4c1d95"/>
  <ellipse cx="572" cy="456" rx="26" ry="11" fill="#6d28d9" stroke="#c4b5fd"/>
  <text x="616" y="436" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="700">MongoDB</text>
  <text x="616" y="458" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12">traces / spans / keys</text>

  <g class="pulse-3">
    <rect x="984" y="88" width="304" height="456" rx="20" fill="none" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <rect x="984" y="88" width="304" height="456" rx="20" fill="url(#card-ins)" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.4"/>
  <rect x="984" y="88" width="7" height="456" rx="4" fill="url(#amber)"/>
  <text x="1006" y="118" fill="#fcd34d" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">INSIGHTS</text>
  <rect x="1004" y="136" width="264" height="186" rx="14" fill="#1c1408" stroke="#b45309"/>
  <text x="1020" y="164" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700">Evaluation engine</text>
  <circle cx="1028" cy="192" r="4" fill="#f59e0b"/>
  <text x="1042" y="197" fill="#fde68a" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">Span and trace metrics</text>
  <circle cx="1028" cy="220" r="4" fill="#f59e0b"/>
  <text x="1042" y="225" fill="#fde68a" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">Judge LLM</text>
  <circle cx="1028" cy="248" r="4" fill="#f59e0b"/>
  <text x="1042" y="253" fill="#fde68a" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">Web search fact-check</text>
  <circle cx="1028" cy="276" r="4" fill="#f59e0b"/>
  <text x="1042" y="281" fill="#fde68a" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">Harness recommendations</text>
  <rect x="1004" y="338" width="264" height="174" rx="14" fill="#1c1408" stroke="#b45309"/>
  <text x="1020" y="366" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700">Dashboard</text>
  <circle cx="1028" cy="394" r="4" fill="#fbbf24"/>
  <text x="1042" y="399" fill="#fde68a" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">Live traces</text>
  <circle cx="1028" cy="422" r="4" fill="#fbbf24"/>
  <text x="1042" y="427" fill="#fde68a" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">Costs per model</text>
  <circle cx="1028" cy="450" r="4" fill="#fbbf24"/>
  <text x="1042" y="455" fill="#fde68a" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13">Cursor and Claude rules</text>

  <!-- Gutter 1: 412 to 508 (96px). Labels stay inside. -->
  <path d="M414 318 L496 318" fill="none" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow-cyan)" class="flow" filter="url(#glow-cyan)"/>
  <circle r="4.5" fill="#67e8f9" filter="url(#glow-cyan)">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M414 318 L496 318"/>
  </circle>
  <rect x="418" y="268" width="80" height="36" rx="8" fill="#071016" stroke="#22d3ee"/>
  <text x="458" y="282" text-anchor="middle" fill="#67e8f9" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10" font-weight="700">fire-and</text>
  <text x="458" y="296" text-anchor="middle" fill="#67e8f9" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10" font-weight="700">forget</text>

  <!-- Gutter 2: 888 to 984 (96px). -->
  <path d="M890 318 L972 318" fill="none" stroke="#c4b5fd" stroke-width="3" marker-end="url(#arrow-violet)" class="flow-slow" filter="url(#glow-violet)"/>
  <circle r="4.5" fill="#e9d5ff" filter="url(#glow-violet)">
    <animateMotion dur="2s" repeatCount="indefinite" path="M890 318 L972 318"/>
  </circle>
  <rect x="894" y="268" width="80" height="36" rx="8" fill="#12081f" stroke="#a78bfa"/>
  <text x="934" y="282" text-anchor="middle" fill="#c4b5fd" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10" font-weight="700">score and</text>
  <text x="934" y="296" text-anchor="middle" fill="#c4b5fd" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10" font-weight="700">advise</text>

  <rect x="32" y="564" width="1256" height="148" rx="18" fill="#10081c" stroke="#4c1d95"/>
  <text x="56" y="598" fill="#e9d5ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ONE PROJECT KEY  -  EVERY PATH</text>
  <text x="56" y="624" fill="#cbd5e1" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14">SDK / OpenTelemetry / MCP capture a run. The backend stores it, evaluates it, then recommends a fix. Nothing blocks the LLM call.</text>
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600">
    <rect x="56" y="648" width="100" height="26" rx="13" fill="#083344" stroke="#22d3ee"/>
    <text x="106" y="666" text-anchor="middle" fill="#a5f3fc">1. Capture</text>
    <rect x="168" y="648" width="88" height="26" rx="13" fill="#2e1065" stroke="#a78bfa"/>
    <text x="212" y="666" text-anchor="middle" fill="#ddd6fe">2. Store</text>
    <rect x="268" y="648" width="104" height="26" rx="13" fill="#451a03" stroke="#f59e0b"/>
    <text x="320" y="666" text-anchor="middle" fill="#fde68a">3. Evaluate</text>
    <rect x="384" y="648" width="124" height="26" rx="13" fill="#4a044e" stroke="#f472b6"/>
    <text x="446" y="666" text-anchor="middle" fill="#fbcfe8">4. Recommend</text>
  </g>
</svg>
