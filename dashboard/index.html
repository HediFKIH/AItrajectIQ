<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AItrajectIQ — Agentic workflow observability. Trace every path. Understand every action." />
    <meta name="theme-color" content="#6d28d9" />
    <title>AItrajectIQ · Agentic workflow observability</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("aitrajectiq.theme") || "system";
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
